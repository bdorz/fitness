name: Build & Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Read app version
        id: app
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: npm run build

      - name: Stage APK
        run: |
          mkdir -p .release
          cp android/app/build/outputs/apk/release/app-release.apk ".release/健身紀錄-v${{ steps.app.outputs.version }}.apk"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app.outputs.version }}
          name: '健身紀錄 v${{ steps.app.outputs.version }}'
          body: |
            🏋️ 手動建置 #${{ github.run_number }}
            提交：${{ github.sha }}
          files: .release/健身紀錄-v${{ steps.app.outputs.version }}.apk

      - name: Remove local APK artifacts
        if: always()
        run: |
          rm -f .release/*.apk
          rm -f android/app/build/outputs/apk/release/*.apk
